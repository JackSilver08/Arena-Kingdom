name: Arena Kingdom QA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Documentary static checks
        run: npm run qa:static

      - name: Typecheck
        run: npm run typecheck

      - name: Shared tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Bundle budget
        run: npm run check:bundle

      - name: Export campaign atlas artwork
        run: node --import tsx tools/export-campaign-plate.ts

      - name: Upload actual generated SVG for visual review
        uses: actions/upload-artifact@v4
        with:
          name: medieval-campaign-map
          path: artifacts/medieval-campaign-map.svg
          retention-days: 30

      - name: Export P2 buildings and military counters
        run: node --import tsx tools/export-campaign-entities.ts

      - name: Upload P2 entity art proof
        uses: actions/upload-artifact@v4
        with:
          name: medieval-campaign-entities
          path: artifacts/medieval-campaign-entities.svg
          retention-days: 30

      - name: Economy balance lab
        run: npm run simulate:balance -- 4
